# --- Ergänzungen (in CLAUDE.md beschrieben, aber ohne Startwert) ---
crs_metric: "EPSG:25832"
crs_export: "EPSG:4326"
cache_dir: cache
output_dir: output
# overpass-api.de ist aus dieser Umgebung gesperrt; die Spiegel liefern sporadisch 5xx → reihum versuchen.
# Der Cache-Schlüssel enthält die URL: der Hauptserver wird zuerst gefragt (Cache-Treffer), dann die Ersatzserver.
overpass_url: "https://overpass.kumi.systems/api"
overpass_fallback_urls: ["https://overpass.private.coffee/api", "https://maps.mail.ru/osm/tools/overpass/api"]
requests_timeout_s: 300
overpass_retries: 20
overpass_retry_wait_s: 30
random_seed: 42               # NaturalBreaks (k-means) ist zufallsinitialisiert
dedupe_m: 15
min_part_m2: 500           # Splitter aus getrenntem Vereinfachen verwerfen (≪ Zellfläche Res. 10 ≈ 15 000 m²)

# Kategorien in Prioritätsreihenfolge (erste Übereinstimmung gewinnt).
# Regel: true = jeder Wert, Liste = nur diese Werte, {exclude: [...]} = jeder Wert außer diesen
# Apotheken zählen zum Einzelhandel; dienstleistende shop-Typen (Friseur, Reisebüro …) zur Dienstleistung.
categories:
  retail:
    shop: {exclude: [vacant, hairdresser, beauty, massage, tattoo, travel_agency, dry_cleaning, laundry, tailor,
                     funeral_directors, bookmaker, lottery, pawnbroker, money_lender, gold_buyer, copyshop,
                     international_calls, ticket, storage_rental, tool_hire, rental, repair, license_plates,
                     cannabis, erotic, nails]}
    amenity: [pharmacy]
  gastro:
    amenity: [restaurant, cafe, fast_food, bar, pub, ice_cream, biergarten]
  service:
    shop: [hairdresser, beauty, massage, tattoo, travel_agency, dry_cleaning, laundry, tailor, funeral_directors,
           bookmaker, lottery, pawnbroker, money_lender, gold_buyer, copyshop, international_calls, ticket,
           storage_rental, tool_hire, rental, repair, license_plates, nails]
    amenity: [bank, post_office]
    craft: true
    office: true
  culture_leisure:
    tourism: [museum, gallery, attraction]
    amenity: [cinema, theatre, library, arts_centre]
    leisure: {exclude: [park, garden, pitch, playground]}
  health:
    healthcare: true
    amenity: [doctors, dentist]
exclude_prefixes: ["disused:", "abandoned:"]
# POIs in Einkaufszentren (shop=mall-Flächen) zählen nicht: Frequenz im Center ist keine Straßenfrequenz
exclude_malls: true

# nur Kontext/Karte
context:
  pedestrian: {highway: [pedestrian, living_street]}
  transit_stop: {highway: [bus_stop], public_transport: [platform, stop_position, station], railway: [tram_stop, station, halt]}

qa:
  max_overlap_m2: 1.0
  min_compactness: 0.2
  sensitivity: [{h3_resolution: 12}, {smoothing: {radius_m: 150, sigma_m: 60}}]
  min_iou: 0.7
  plausibility:                 # Z1 muss diese OSM-Objekte (Name) schneiden
    "Heilbronn, Germany": ["Fleiner Straße", "Sülmerstraße", "Kaiserstraße", "Marktplatz"]

# --- Erdgeschoss-POIs (poi_model: ground_floor) ---
ground_floor_categories:
  retail:
    shop: {exclude: [vacant]}
    amenity: [pharmacy]
  gastro:
    amenity: [restaurant, cafe, fast_food, bar, pub, ice_cream, biergarten]
  service:
    amenity: [bank]

# --- Street-Modus: Lagen über Straßenabschnitte ---
street:
  segment_length_m: 50
  snap_max_dist_m: 30
  buffer_m: 20
  smoothing_neighbors: 1
  brand_weight: 1.75
  thresholds:            # gewichtete Betriebe je 100 m Straßenfront
    lage_1a: {min_density: 8, min_brand_share: 0.40}
    lage_1b: {min_density: 5}
    lage_2:  {min_density: 2}
  max_gap_segments: 1
  # 1a-Startpunkt: max_density (Vorgabe: Kette mit dem dichtesten Segment) | strongest_chain (Kette mit der
  # größten gewichteten POI-Summe). Heilbronn: max_density startet an der Stadtgalerie-Rückseite (Metzgergasse).
  seed: strongest_chain
  min_hole_ha: 0.2
  target_ranges_km: {lage_1a: [0.6, 1.2], lage_1b: [1.0, 2.0], lage_2: [2.0, 4.0]}
  # ha-Ziele entfallen: Polygone sind nur noch Straßenraum (Puffer minus Gebäude)
  auto_calibrate: false
  # Kalibrierung auf eine Expertenabgrenzung (falls für die Stadt vorhanden): Schwellen für 1a und 1b werden so
  # gewählt, dass die Referenzsegmente möglichst genau getroffen werden (F1 über Länge); 2-Lage weiter über
  # target_ranges_km. km-Ziele für 1a/1b = Referenzlänge ± reference_tolerance.
  reference:
    "Heilbronn, Germany": reference/heilbronn_lagen.geojson
  reference_match_m: 5          # Segment gehört zur Referenz, wenn sein Mittelpunkt ≤ 5 m von ihr entfernt liegt
  reference_tolerance: 0.25
  lagen_from_reference: false   # true: 1a/1b = Referenz, 2-Lage = Segmente ≥ lage_2-Schwelle, die daran anschließen
  # Auswertungspolygon = Straßenraum: Puffer (buffer_m) um die Achsen minus Gebäude und Malls
  street_space_only: true
  building_query_radius_m: 1000
  calibration_iterations: 40
  highway: [pedestrian, living_street, residential, unclassified, tertiary, secondary, primary]
  highway_named_only: [footway, path]      # nur mit name-Tag
  touch_tolerance_m: 0.5                   # Zusammenhang: Segmente berühren sich (Endpunkt oder Kreuzung)
  plausibility:                 # Kaiser- und Sülmerstraße sind laut Expertenabgrenzung (19.10.2026) 1b
    "Heilbronn, Germany": ["Fleiner Straße"]
