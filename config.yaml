# Startwerte laut CLAUDE.md
city: "Heilbronn, Germany"
mode: street                   # street | grid
# ground_floor = Erdgeschoss-Nutzungen + Filialistengewicht (Street- und Rastermodus)
# categories   = bisherige Kategorien (weights) + Flächenfaktor (size_weighting)
poi_model: ground_floor
search_radius_m: 2000
# Z1 = 1A-Lage, Z2 = 1B-Lage, Z3 = 2R-Lage (Nebenlage)
h3_resolution: 11              # Ø 2150 m² je Zelle ≈ Mindestgröße der 1A-Lage
# Glättung in Metern (stadt- und auflösungsunabhängig); k und σ in Zellen werden daraus berechnet
# radius_m 50 ≙ k = 1 bei Res. 11 (Zellabstand ≈ 50 m); vorher 100 m (k = 2)
smoothing: {radius_m: 50, sigma_m: 40}
classification: peak_share     # peak_share | jenks | quantile | equal_area
# peak_share: Zelle gehört zur Klasse, wenn ihre Dichte ≥ Anteil × Spitzenwert der Stadt ist.
# Gleiche Regel in jeder Stadt → Zonen sind über Städte hinweg vergleichbar abgegrenzt.
peak_share: [0.5, 0.25, 0.1]   # 1A, 1B, 2R
min_zone_m2: {Z1: 2000}        # Untergrenze 1A-Lage (harte Prüfung)
# Höchstfläche je Zone (Z1, Z2, Z3): größere Zonen auf die dichtesten zusammenhängenden Zellen kürzen,
# abgeschnittene Zellen gehen an die nächste Zone. Gilt nicht für equal_area (Flächen dort fest vorgegeben).
max_area_ha: [6, 10, 20]
quantiles: [0.5, 0.75, 0.9]
equal_area_ha: [10, 20, 30]    # Z1, Z1+Z2, Z1+Z2+Z3 (kumulativ)
closing_buffer_m: 10           # < halbe Zellbreite (Res. 11 ≈ 50 m), sonst werden Nachbarlücken zugeschlossen
min_hole_ha: 0.5
simplify_m: 5
# Einzelhandel > Gastronomie > Dienstleistung > sonstige (Kultur/Freizeit, Gesundheit)
weights:
  retail: 1.0
  gastro: 0.5
  service: 0.3
  culture_leisure: 0.15
  health: 0.15

# Zusatzgewicht Einzelhandel nach typischer Verkaufsfläche (Schätzwerte, m²):
# faktor = clip((fläche / ref_area_m2) ^ exponent) × chain_factor (wenn OSM-Tag brand gesetzt = Filialist).
# Reihenfolge: brand → name → shop-Typ → ref_area_m2. Nicht zentrenrelevante Sortimente → fester Faktor.
size_weighting:
  enabled: true
  ref_area_m2: 200
  exponent: 0.5               # Wurzel dämpft Großflächen (Kaufhaus ≠ 50 Boutiquen)
  clip: [0.5, 4.0]
  chain_factor: 1.2
  not_central_factor: 0.2
  not_central: [car, car_repair, car_parts, tyres, motorcycle, truck, furniture, kitchen, bed, carpet,
                doityourself, hardware, garden_centre, wholesale, gas, bathroom_furnishing, farm, trade,
                building_materials, boat, caravan, fuel]
  shop_area_m2:
    department_store: 5000
    mall: 200                 # Mieter sind einzeln erfasst → neutral
    clothes: 350
    shoes: 300
    sports: 600
    outdoor: 400
    electronics: 800
    books: 400
    toys: 400
    variety_store: 400
    chemist: 600
    supermarket: 200          # Nahversorgung, für Innenstadtlagen nicht prägend → neutral
    cosmetics: 150
    perfumery: 200
    bag: 150
    jewelry: 80
    watches: 80
    optician: 120
    hearing_aids: 80
    gift: 100
    bakery: 60
    butcher: 80
    confectionery: 60
    coffee: 60
    tea: 60
    deli: 80
    mobile_phone: 60
    telecommunication: 80
    kiosk: 30
    tobacco: 30
    e-cigarette: 30
    convenience: 80
    beverages: 150
    alcohol: 80
  brand_area_m2:
    "Galeria Kaufhof": 12000
    "Galeria": 12000
    "Primark": 5000
    "C&A": 2000
    "H&M": 1800
    "TK Maxx": 1500
    "Müller": 1500
    "Decathlon": 2500
    "Intersport": 1000
    "Osiander": 1000
    "Thalia": 1000
    "MediaMarkt": 3000
    "Saturn": 3000
    "Woolworth": 800
    "Action": 800
    "New Yorker": 700
